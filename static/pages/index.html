<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · FitTrack</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <div class="auth">
        <aside class="auth-art">
            <a class="wordmark" href="/">FitTrack <small>training log</small></a>
            <blockquote>Show up.<br>Write it <em>down</em>.<br>Repeat.</blockquote>
            <p class="colophon">Workouts, meals and weigh-ins kept in one plain log, so you judge yourself on the trend and not on one bad day.</p>
        </aside>
        <main class="auth-form">
            <div class="auth-form-inner">
                <h1>Sign in</h1>
                <p class="lede">Pick up where you left off.</p>

                <div id="authAlert" class="alert alert-error"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" required autocomplete="username" autofocus>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Sign in</button>
                </form>

                <p class="switch">New here? <a href="/static/pages/register.html">Start a log</a></p>
            </div>
        </main>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
