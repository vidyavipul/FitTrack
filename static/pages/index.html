<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FitTrack - Your personal fitness and progress tracker. Log workouts, track calories, and monitor your progress.">
    <title>FitTrack – Sign In</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <h1>💪 FitTrack</h1>
                <p>Your personal fitness companion</p>
            </div>

            <h2>Welcome Back</h2>

            <div id="authAlert" class="alert alert-error"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-full">Sign In</button>
            </form>

            <p class="text-center text-muted mt-lg" style="font-size: 0.9rem;">
                Don't have an account? <a href="/static/pages/register.html">Create one</a>
            </p>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
