<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meals · FitTrack</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <header class="masthead">
        <div class="masthead-inner">
            <a class="wordmark" href="/static/pages/dashboard.html">FitTrack <small>training log</small></a>
            <nav class="tabs" aria-label="Main">
                <a href="/static/pages/dashboard.html">Overview</a>
                <a href="/static/pages/workouts.html">Workouts</a>
                <a href="/static/pages/calories.html" class="active" aria-current="page">Meals</a>
                <a href="/static/pages/progress.html">Body</a>
            </nav>
            <div class="who">
                <span class="monogram" id="userAvatar" aria-hidden="true">U</span>
                <span id="userName">User</span>
                <button class="link-btn" onclick="logout()">Sign out</button>
            </div>
        </div>
    </header>

    <main class="page">
        <div class="page-head">
            <div>
                <p class="kicker" id="dayKicker">&nbsp;</p>
                <h1 id="dayTitle">Today</h1>
            </div>
            <div class="date-nav">
                <button class="step-btn" onclick="shiftDay(-1)" aria-label="Previous day">‹</button>
                <input type="date" id="filterDate" class="date-field" aria-label="Date">
                <button class="step-btn" id="nextDay" onclick="shiftDay(1)" aria-label="Next day">›</button>
                <button class="btn btn-primary" onclick="openCalorieModal()">Log a meal</button>
            </div>
        </div>

        <div id="alertArea" class="alert"></div>

        <div class="figures">
            <div class="figure accent">
                <div class="figure-label">Energy</div>
                <div class="figure-value"><span id="totalCals">0</span><span class="unit">kcal</span></div>
            </div>
            <div class="figure">
                <div class="figure-label">Protein</div>
                <div class="figure-value"><span id="totalProtein">0</span><span class="unit">g</span></div>
            </div>
            <div class="figure">
                <div class="figure-label">Carbs</div>
                <div class="figure-value"><span id="totalCarbs">0</span><span class="unit">g</span></div>
            </div>
            <div class="figure">
                <div class="figure-label">Fat</div>
                <div class="figure-value"><span id="totalFat">0</span><span class="unit">g</span></div>
            </div>
            <div class="figure">
                <div class="figure-label">Meals</div>
                <div class="figure-value" id="mealCount">0</div>
            </div>
        </div>

        <div class="split">
            <section class="section">
                <div class="section-head">
                    <h2>What you ate</h2>
                </div>
                <div id="calorieList">
                    <p class="empty">Loading…</p>
                </div>
            </section>
            <section class="section">
                <div class="section-head">
                    <h2>Where it came from</h2>
                </div>
                <div class="plate" id="macroPlate"></div>
            </section>
        </div>
    </main>

    <div class="modal-overlay" id="calorieModal" onclick="if (event.target === this) closeCalorieModal()">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="calorieModalTitle">
            <h3 id="calorieModalTitle">Log a meal</h3>
            <div id="formAlert" class="alert"></div>
            <form id="calorieForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="mealDate">Date</label>
                        <input type="date" id="mealDate" required>
                    </div>
                    <div class="form-group">
                        <label for="mealType">Meal</label>
                        <select id="mealType" required>
                            <option value="breakfast">Breakfast</option>
                            <option value="lunch">Lunch</option>
                            <option value="dinner">Dinner</option>
                            <option value="snack">Snack</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="foodName">What was it?</label>
                    <input type="text" id="foodName" placeholder="Dal, rice and salad" maxlength="100" required>
                </div>
                <div class="form-group">
                    <label for="mealCalories">Calories (kcal)</label>
                    <input type="number" id="mealCalories" placeholder="0" min="0" required>
                </div>
                <div class="form-row" style="grid-template-columns: 1fr 1fr 1fr;">
                    <div class="form-group">
                        <label for="mealProtein">Protein (g)</label>
                        <input type="number" id="mealProtein" placeholder="0" min="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label for="mealCarbs">Carbs (g)</label>
                        <input type="number" id="mealCarbs" placeholder="0" min="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label for="mealFat">Fat (g)</label>
                        <input type="number" id="mealFat" placeholder="0" min="0" step="0.1">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeCalorieModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save meal</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/calories.js"></script>
</body>
</html>
