<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack – Calories</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <div class="app-layout">
        <nav class="sidebar">
            <div class="brand">💪 FitTrack</div>
            <ul class="nav-links">
                <li><a href="/static/pages/dashboard.html"><span class="nav-icon">📊</span> Dashboard</a></li>
                <li><a href="/static/pages/workouts.html"><span class="nav-icon">🏋️</span> Workouts</a></li>
                <li><a href="/static/pages/calories.html" class="active"><span class="nav-icon">🍽️</span> Calories</a>
                </li>
                <li><a href="/static/pages/progress.html"><span class="nav-icon">📈</span> Progress</a></li>
            </ul>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <span class="user-name" id="userName">User</span>
                </div>
                <button class="btn btn-secondary btn-sm btn-full" onclick="logout()">Sign Out</button>
            </div>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1>🍽️ Calorie Tracker</h1>
                    <p>Log your meals and track your nutrition</p>
                </div>
                <button class="btn btn-primary" onclick="openCalorieModal()">+ Log Meal</button>
            </div>

            <div id="alertArea" class="alert"></div>

            <!-- Daily Summary -->
            <div class="stat-cards" style="grid-template-columns: repeat(5, 1fr);">
                <div class="card stat-card green">
                    <div class="stat-icon">🔥</div>
                    <div class="stat-value" id="totalCals">0</div>
                    <div class="stat-label">Calories</div>
                </div>
                <div class="card" style="text-align: center;">
                    <div style="font-size: 1.6rem; font-weight: 800; color: var(--accent-primary);" id="totalProtein">0g
                    </div>
                    <div class="stat-label">Protein</div>
                </div>
                <div class="card" style="text-align: center;">
                    <div style="font-size: 1.6rem; font-weight: 800; color: var(--warning);" id="totalCarbs">0g</div>
                    <div class="stat-label">Carbs</div>
                </div>
                <div class="card" style="text-align: center;">
                    <div style="font-size: 1.6rem; font-weight: 800; color: var(--danger);" id="totalFat">0g</div>
                    <div class="stat-label">Fat</div>
                </div>
                <div class="card" style="text-align: center;">
                    <div style="font-size: 1.6rem; font-weight: 800; color: var(--info);" id="mealCount">0</div>
                    <div class="stat-label">Meals</div>
                </div>
            </div>

            <!-- Date Filter -->
            <div class="flex-between mb-lg">
                <h2>Meal Log</h2>
                <div style="display: flex; gap: var(--space-sm); align-items: center;">
                    <input type="date" id="filterDate" class="form-group"
                        style="margin: 0; padding: 0.5rem 0.8rem; background: var(--bg-glass); border: 1px solid var(--border-glass); border-radius: var(--radius-sm); color: var(--text-primary); font-family: inherit;">
                </div>
            </div>

            <div class="card">
                <div id="calorieList">
                    <div class="empty-state">
                        <div class="empty-icon">🍽️</div>
                        <p>No meals logged for today. Click "Log Meal" to start!</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Log Meal Modal -->
    <div class="modal-overlay" id="calorieModal">
        <div class="modal">
            <h3>Log Meal</h3>
            <form id="calorieForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="mealDate">Date</label>
                        <input type="date" id="mealDate" required>
                    </div>
                    <div class="form-group">
                        <label for="mealType">Meal Type</label>
                        <select id="mealType" required>
                            <option value="breakfast">Breakfast</option>
                            <option value="lunch">Lunch</option>
                            <option value="dinner">Dinner</option>
                            <option value="snack">Snack</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="foodName">Food Name</label>
                    <input type="text" id="foodName" placeholder="e.g. Grilled Chicken Salad" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="mealCalories">Calories</label>
                        <input type="number" id="mealCalories" placeholder="0" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="mealProtein">Protein (g)</label>
                        <input type="number" id="mealProtein" placeholder="0" min="0" step="0.1">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="mealCarbs">Carbs (g)</label>
                        <input type="number" id="mealCarbs" placeholder="0" min="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label for="mealFat">Fat (g)</label>
                        <input type="number" id="mealFat" placeholder="0" min="0" step="0.1">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeCalorieModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Meal</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/calories.js"></script>
</body>

</html>
