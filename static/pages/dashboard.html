<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview · FitTrack</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <header class="masthead">
        <div class="masthead-inner">
            <a class="wordmark" href="/static/pages/dashboard.html">FitTrack <small>training log</small></a>
            <nav class="tabs" aria-label="Main">
                <a href="/static/pages/dashboard.html" class="active" aria-current="page">Overview</a>
                <a href="/static/pages/workouts.html">Workouts</a>
                <a href="/static/pages/calories.html">Meals</a>
                <a href="/static/pages/progress.html">Body</a>
            </nav>
            <div class="who">
                <span class="monogram" id="userAvatar" aria-hidden="true">U</span>
                <span id="userName">User</span>
                <button class="link-btn" onclick="logout()">Sign out</button>
            </div>
        </div>
    </header>

    <main class="page">
        <div class="page-head">
            <div>
                <p class="kicker" id="todayDate"></p>
                <h1 id="greeting">Hello</h1>
            </div>
            <a href="/static/pages/workouts.html" class="btn btn-primary">Log a workout</a>
        </div>

        <div class="figures">
            <div class="figure">
                <div class="figure-label">Sessions today</div>
                <div class="figure-value" id="statWorkouts">0</div>
            </div>
            <div class="figure accent">
                <div class="figure-label">Eaten today</div>
                <div class="figure-value"><span id="statCalories">0</span><span class="unit">kcal</span></div>
            </div>
            <div class="figure">
                <div class="figure-label">Body weight</div>
                <div class="figure-value"><span id="statWeight">--</span><span class="unit">kg</span></div>
            </div>
            <div class="figure">
                <div class="figure-label">Exercises on file</div>
                <div class="figure-value" id="statExercises">0</div>
            </div>
        </div>

        <div class="split">
            <section class="section">
                <div class="section-head">
                    <h2>Recent sessions</h2>
                    <a href="/static/pages/workouts.html">All workouts</a>
                </div>
                <div id="recentWorkouts">
                    <p class="empty">Nothing logged yet.<small>Your sessions will show up here.</small></p>
                </div>
            </section>

            <div>
                <section class="section">
                    <div class="section-head">
                        <h2>This week</h2>
                        <span class="aside" id="weekCount"></span>
                    </div>
                    <div class="week" id="weekStrip"></div>
                </section>

                <section class="section">
                    <div class="section-head">
                        <h2>Today's plate</h2>
                        <a href="/static/pages/calories.html">Log a meal</a>
                    </div>
                    <div class="plate" id="macroPlate"></div>
                </section>
            </div>
        </div>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
