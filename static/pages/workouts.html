<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workouts · FitTrack</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <header class="masthead">
        <div class="masthead-inner">
            <a class="wordmark" href="/static/pages/dashboard.html">FitTrack <small>training log</small></a>
            <nav class="tabs" aria-label="Main">
                <a href="/static/pages/dashboard.html">Overview</a>
                <a href="/static/pages/workouts.html" class="active" aria-current="page">Workouts</a>
                <a href="/static/pages/calories.html">Meals</a>
                <a href="/static/pages/progress.html">Body</a>
            </nav>
            <div class="who">
                <span class="monogram" id="userAvatar" aria-hidden="true">U</span>
                <span id="userName">User</span>
                <button class="link-btn" onclick="logout()">Sign out</button>
            </div>
        </div>
    </header>

    <main class="page">
        <div class="page-head">
            <div>
                <p class="kicker" id="sessionCount">&nbsp;</p>
                <h1>Training log</h1>
                <p class="lede">Every session you've logged, newest first.</p>
            </div>
            <button class="btn btn-primary" onclick="openWorkoutModal()">Log a workout</button>
        </div>

        <div id="alertArea" class="alert"></div>

        <div class="section-head">
            <h2>Sessions</h2>
        </div>
        <ul class="entries" id="workoutList">
            <li class="empty">Loading…</li>
        </ul>
    </main>

    <div class="modal-overlay" id="workoutModal" onclick="if (event.target === this) closeWorkoutModal()">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="workoutModalTitle">
            <h3 id="workoutModalTitle">New session</h3>
            <div id="formAlert" class="alert"></div>
            <form id="workoutForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="workoutDate">Date</label>
                        <input type="date" id="workoutDate" required>
                    </div>
                    <div class="form-group">
                        <label for="workoutDuration">Duration (min)</label>
                        <input type="number" id="workoutDuration" placeholder="45" min="1" max="1440">
                    </div>
                </div>
                <div class="form-group">
                    <label for="workoutNotes">Name or notes</label>
                    <textarea id="workoutNotes" rows="2" placeholder="Push day, felt strong on bench"></textarea>
                </div>

                <div class="subhead">
                    <h4>Exercises</h4>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="addSetRow()">Add exercise</button>
                </div>
                <div id="setsContainer"></div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeWorkoutModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save session</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/workouts.js"></script>
</body>
</html>
